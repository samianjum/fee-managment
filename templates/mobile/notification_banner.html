{% load static %}
<div id="feeNotificationBanner" class="notification-banner slide-in">
    <div class="banner-content">
        <div class="banner-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
        </div>
        <div class="banner-message">
            <strong>New Fee Vouchers Generated!</strong>
            <span>
        {{ new_vouchers_count }} new voucher(s) have been created
        {% if voucher_month and voucher_year %}for {{ voucher_month }}/{{ voucher_year }}{% endif %}.
    </span>
        </div>
        <div class="banner-actions">
            <a href="{% url 'mobile_vouchers_list' schema_name=tenant.schema_name %}" class="btn-primary btn-sm">View Vouchers</a>
            <button class="btn-ghost" id="dismissNotificationBtn">Dismiss</button>
        </div>
        <button class="banner-close" id="dismissNotificationCloseBtn" aria-label="Dismiss">&times;</button>
    </div>
</div>

<style>
    .notification-banner {
        margin: 0.5rem 0 1rem;
        border-radius: 1.5rem;
        background: rgba(255,255,255,0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.6);
        box-shadow: 0 8px 32px rgba(0,0,0,0.06);
        padding: 0.2rem 0.2rem 0.2rem 0.2rem;
        overflow: hidden;
        position: relative;
        transform: translateY(-20px);
        opacity: 0;
        animation: slideDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes slideDown {
        0% { transform: translateY(-20px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
    }
    .banner-content {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.6rem 0.8rem 0.6rem 0.8rem;
        flex-wrap: wrap;
        position: relative;
    }
    .banner-icon {
        width: 44px;
        height: 44px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        flex-shrink: 0;
    }
    .banner-icon svg {
        stroke: white;
    }
    .banner-message {
        flex: 1;
        min-width: 150px;
        font-size: 0.85rem;
        color: #1e293b;
        line-height: 1.4;
    }
    .banner-message strong {
        display: block;
        font-weight: 700;
        font-size: 0.95rem;
        color: #0f172a;
    }
    .banner-message span {
        color: #475569;
    }
    .banner-actions {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
    }
    .banner-actions .btn-sm {
        padding: 0.3rem 1rem;
        border-radius: 2rem;
        font-weight: 600;
        font-size: 0.8rem;
        text-decoration: none;
        border: none;
        cursor: pointer;
    }
    .banner-actions .btn-primary {
        background: #3b82f6;
        color: white;
        transition: 0.2s;
    }
    .banner-actions .btn-primary:hover {
        background: #2563eb;
        transform: translateY(-1px);
    }
    .banner-actions .btn-ghost {
        background: transparent;
        color: #64748b;
        border: 1px solid #e2e8f0;
        transition: 0.2s;
    }
    .banner-actions .btn-ghost:hover {
        background: #f1f5f9;
        color: #1e293b;
    }
    .banner-close {
        position: absolute;
        top: 0.4rem;
        right: 0.4rem;
        background: transparent;
        border: none;
        font-size: 1.2rem;
        color: #94a3b8;
        cursor: pointer;
        padding: 0.1rem 0.4rem;
        border-radius: 999px;
        transition: 0.2s;
        line-height: 1;
    }
    .banner-close:hover {
        background: #f1f5f9;
        color: #0f172a;
    }

    @media (max-width: 480px) {
        .banner-content {
            padding: 0.5rem 0.6rem 0.5rem 0.6rem;
            gap: 0.5rem;
        }
        .banner-icon {
            width: 36px;
            height: 36px;
        }
        .banner-message {
            font-size: 0.75rem;
        }
        .banner-message strong {
            font-size: 0.85rem;
        }
        .banner-actions .btn-sm {
            font-size: 0.7rem;
            padding: 0.2rem 0.8rem;
        }
        .banner-close {
            font-size: 1rem;
            top: 0.2rem;
            right: 0.2rem;
        }
    }
</style>

<script>
    (function() {
        function dismissBanner() {
            const banner = document.getElementById('feeNotificationBanner');
            if (banner) {
                banner.style.transform = 'translateY(-20px)';
                banner.style.opacity = '0';
                banner.style.transition = 'opacity 0.3s, transform 0.3s';
                setTimeout(() => { banner.style.display = 'none'; }, 400);
            }
            const url = window.location.pathname + '?dismiss_notification=1';
            fetch(url, { method: 'GET', credentials: 'same-origin' })
                .then(() => console.log('Notification dismissed'))
                .catch(() => {});
        }

        document.getElementById('dismissNotificationBtn')?.addEventListener('click', dismissBanner);
        document.getElementById('dismissNotificationCloseBtn')?.addEventListener('click', dismissBanner);
    })();
</script>
